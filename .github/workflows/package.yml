name: Build checked release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: checked-windows-release-candidate
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
